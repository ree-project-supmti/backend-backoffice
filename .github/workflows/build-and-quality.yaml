name: Build and Quality Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Tests with Coverage
        run: mvn clean verify

      - name: Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn org.owasp:dependency-check-maven:check -Dformat=HTML -DnvdApiKey=$NVD_API_KEY

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.REE_SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
          -Dsonar.projectKey=ree-project-supmti_backend-backoffice \
          -Dsonar.organization=ree-project-supmti \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=$REE_SONAR_TOKEN

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports
          path: target/site/jacoco/

      - name: Upload Dependency Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

      - name: Quality Gate Status
        run: |
          echo "Build completed successfully"
          echo "Coverage and Quality reports available in artifacts"
          echo "Check SonarCloud dashboard for detailed analysis"